# Contributor override — Compose merges this automatically when it is next to compose.yml.
#
# compose.yml alone is PULL-ONLY, so a user who never cloned the repo can run it. This file adds the
# `build:` blocks, so in a clone `docker compose build` builds from source and `up` uses what you built.
# It is not shipped in a release.

# `target` is NOT optional. Without it, Docker builds the LAST stage of the Dockerfile — which is how
# every gate image came to be built from the alpine tool-server stage (shell, git, ripgrep) while every
# doc claimed distroless. Name the stage you mean.
x-gate-build: &gate-build
  context: .
  dockerfile: Dockerfile
  target: runtime

services:
  stag-serve:
    build:
      <<: *gate-build
      args: [CMD=stag-serve]
  stag-proxy:
    build:
      <<: *gate-build
      args: [CMD=stag-proxy]
  harness-serve:
    build:
      <<: *gate-build
      args: [CMD=harness-serve]
  # The tool server is behind the `tools` profile in compose.yml, so a released install never starts it
  # (and never mounts an examples/ path that only exists in a clone). A CLONE turns it back on with
  # COMPOSE_PROFILES=tools in .env — written by tools/gen-env.sh — so `docker compose up` here is
  # unchanged. `profiles: []` does NOT work for this: compose unions profile lists, it does not replace.
  local-tools:
    build:
      <<: *gate-build
      target: localtools # NOT distroless: a tool server must contain the commands it runs
      args: [CMD=stag-tools]
